name: CI Quality Gates

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy --explicit-package-bases sdk/state sdk/adapters sdk/observability.py tests/test_contracts_hardening.py tests/test_output_snapshots.py

      - name: Unit and contract tests
        run: pytest -q

      - name: Snapshot validation
        run: pytest -q tests/test_snapshots.py tests/test_output_snapshots.py tests/test_contracts_hardening.py
